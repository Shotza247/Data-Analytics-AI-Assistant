<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 580" width="1800" height="580" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <title id="t">AI Data Analytics Assistant architecture</title>
  <desc id="d">Five stages: upload and protect data, ask questions with OpenAI, analyze and ground insights, approve a PDF export, and deliver the PDF through an MCP service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9fb0c8"/>
    </marker>
  </defs>

  <rect width="1800" height="580" fill="#0b1220"/>

  <!-- Header -->
  <text x="60" y="82" font-size="44" font-weight="700" fill="#e6edf7">AI Data Analytics Assistant</text>
  <text x="60" y="122" font-size="22" fill="#9fb0c8">Privacy-first agentic analytics: from raw CSV to stakeholder-ready insight</text>
  <text x="1740" y="82" font-size="20" text-anchor="end" fill="#9fb0c8">OpenAI API + SDK  ·  MCP  ·  Streamlit</text>

  <!-- Flow arrows (card centre line y=310) -->
  <g stroke="#9fb0c8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="352" y1="310" x2="402" y2="310"/>
    <line x1="700" y1="310" x2="750" y2="310"/>
    <line x1="1048" y1="310" x2="1098" y2="310"/>
    <line x1="1396" y1="310" x2="1446" y2="310"/>
  </g>
  <text x="1074" y="296" font-size="13" text-anchor="middle" fill="#fbbf24">PDF?</text>

  <!-- Card 1: Upload & Protect -->
  <g transform="translate(60,170)">
    <rect width="288" height="280" rx="16" fill="#111b2e" stroke="#f87171" stroke-width="2"/>
    <circle cx="40" cy="40" r="20" fill="#f87171"/>
    <text x="40" y="48" font-size="22" font-weight="700" text-anchor="middle" fill="#0b1220">1</text>
    <text x="74" y="48" font-size="22" font-weight="700" fill="#e6edf7">Upload &amp; Protect</text>
    <g transform="translate(32,84)" stroke="#f87171" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 4 L50 12 V28 C50 40 40 49 28 53 C16 49 6 40 6 28 V12 Z"/>
      <rect x="20" y="27" width="16" height="13" rx="2"/>
      <path d="M23 27 V23 a5 5 0 0 1 10 0 V27"/>
    </g>
    <g font-size="17" fill="#c5d1e3">
      <text x="32" y="166">Detects PII / PSI by name</text>
      <text x="32" y="190">and value pattern, then masks</text>
      <text x="32" y="214">values before any AI access.</text>
    </g>
    <rect x="32" y="234" width="170" height="28" rx="14" fill="#1b2740"/>
    <text x="117" y="253" font-size="14" text-anchor="middle" fill="#f87171" font-family="ui-monospace, Consolas, monospace">privacy.py</text>
  </g>

  <!-- Card 2: Ask Questions -->
  <g transform="translate(408,170)">
    <rect width="288" height="280" rx="16" fill="#111b2e" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="40" cy="40" r="20" fill="#60a5fa"/>
    <text x="40" y="48" font-size="22" font-weight="700" text-anchor="middle" fill="#0b1220">2</text>
    <text x="74" y="48" font-size="22" font-weight="700" fill="#e6edf7">Ask Questions</text>
    <g transform="translate(32,84)" stroke="#60a5fa" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M6 8 H50 V38 H24 L12 50 V38 H6 Z"/>
      <circle cx="18" cy="23" r="2.5" fill="#60a5fa"/>
      <circle cx="28" cy="23" r="2.5" fill="#60a5fa"/>
      <circle cx="38" cy="23" r="2.5" fill="#60a5fa"/>
    </g>
    <g font-size="17" fill="#c5d1e3">
      <text x="32" y="166">Plain-language chat with</text>
      <text x="32" y="190">business context. OpenAI plans</text>
      <text x="32" y="214">the analysis within usage caps.</text>
    </g>
    <rect x="32" y="234" width="170" height="28" rx="14" fill="#1b2740"/>
    <text x="117" y="253" font-size="14" text-anchor="middle" fill="#60a5fa" font-family="ui-monospace, Consolas, monospace">OpenAI API + SDK</text>
  </g>

  <!-- Card 3: Analyze & Ground -->
  <g transform="translate(756,170)">
    <rect width="288" height="280" rx="16" fill="#111b2e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="40" cy="40" r="20" fill="#38bdf8"/>
    <text x="40" y="48" font-size="22" font-weight="700" text-anchor="middle" fill="#0b1220">3</text>
    <text x="74" y="48" font-size="22" font-weight="700" fill="#e6edf7">Analyze &amp; Ground</text>
    <g transform="translate(32,84)" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="8" y="30" width="10" height="20"/>
      <rect x="23" y="18" width="10" height="32"/>
      <rect x="38" y="8" width="10" height="42"/>
      <line x1="4" y1="53" x2="52" y2="53"/>
    </g>
    <g font-size="17" fill="#c5d1e3">
      <text x="32" y="166">Hidden code builds tables and</text>
      <text x="32" y="190">charts; a second pass explains</text>
      <text x="32" y="214">only the executed evidence.</text>
    </g>
    <rect x="32" y="234" width="170" height="28" rx="14" fill="#1b2740"/>
    <text x="117" y="253" font-size="14" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace">pandas · matplotlib</text>
  </g>

  <!-- Card 4: Approve Export -->
  <g transform="translate(1104,170)">
    <rect width="288" height="280" rx="16" fill="#111b2e" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="40" cy="40" r="20" fill="#fbbf24"/>
    <text x="40" y="48" font-size="22" font-weight="700" text-anchor="middle" fill="#0b1220">4</text>
    <text x="74" y="48" font-size="22" font-weight="700" fill="#e6edf7">Approve Export</text>
    <g transform="translate(32,84)" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="28" cy="28" r="22"/>
      <path d="M17 29 L25 37 L40 20"/>
    </g>
    <g font-size="17" fill="#c5d1e3">
      <text x="32" y="166">Model calls the PDF tool only</text>
      <text x="32" y="190">on request. You review the</text>
      <text x="32" y="214">disclosure and approve.</text>
    </g>
    <rect x="32" y="234" width="170" height="28" rx="14" fill="#1b2740"/>
    <text x="117" y="253" font-size="14" text-anchor="middle" fill="#fbbf24" font-family="ui-monospace, Consolas, monospace">function calling</text>
  </g>

  <!-- Card 5: Deliver PDF -->
  <g transform="translate(1452,170)">
    <rect width="288" height="280" rx="16" fill="#111b2e" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="40" cy="40" r="20" fill="#a78bfa"/>
    <text x="40" y="48" font-size="22" font-weight="700" text-anchor="middle" fill="#0b1220">5</text>
    <text x="74" y="48" font-size="22" font-weight="700" fill="#e6edf7">Deliver PDF</text>
    <g transform="translate(32,84)" stroke="#a78bfa" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 4 H34 L46 16 V52 H12 Z"/>
      <path d="M34 4 V16 H46"/>
      <line x1="20" y1="30" x2="38" y2="30"/>
      <line x1="20" y1="38" x2="38" y2="38"/>
      <line x1="20" y1="46" x2="32" y2="46"/>
    </g>
    <g font-size="17" fill="#c5d1e3">
      <text x="32" y="166">Sanitized payload goes to the</text>
      <text x="32" y="190">MCP server over Streamable</text>
      <text x="32" y="214">HTTP. No raw CSV is sent.</text>
    </g>
    <rect x="32" y="234" width="190" height="28" rx="14" fill="#1b2740"/>
    <text x="127" y="253" font-size="14" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, Consolas, monospace">pdf_mcp_server.py</text>
  </g>

  <!-- Principles -->
  <g font-size="18" fill="#e6edf7">
    <rect x="60" y="490" width="390" height="48" rx="24" fill="#111b2e" stroke="#243350"/>
    <circle cx="92" cy="514" r="7" fill="#f87171"/>
    <text x="112" y="520">Masked before AI access</text>

    <rect x="490" y="490" width="390" height="48" rx="24" fill="#111b2e" stroke="#243350"/>
    <circle cx="522" cy="514" r="7" fill="#38bdf8"/>
    <text x="542" y="520">Grounded in executed evidence</text>

    <rect x="920" y="490" width="390" height="48" rx="24" fill="#111b2e" stroke="#243350"/>
    <circle cx="952" cy="514" r="7" fill="#fbbf24"/>
    <text x="972" y="520">Approval-gated PDF export</text>

    <rect x="1350" y="490" width="390" height="48" rx="24" fill="#111b2e" stroke="#243350"/>
    <circle cx="1382" cy="514" r="7" fill="#a78bfa"/>
    <text x="1402" y="520">Session-only, no persistent memory</text>
  </g>
</svg>
